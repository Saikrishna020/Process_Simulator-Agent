name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Check the UI script parses
        run: node --check webapp/static/workbench.js
      # The end-to-end LoanApp simulation takes ~2 minutes and needs the full research stack; run it locally.
      - name: Run tests
        run: >
          python -m pytest -q
          --deselect tests/test_tools.py::test_run_simulation_loanapp_end_to_end
          --deselect tests/test_tools.py::test_evaluate_simulation_reuses_evaluate_run
