name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check the UI scripts parse
        run: |
          node --check processlab/web/static/workbench.js
          node --check processlab/web/static/analyst.js
      # The whole suite runs in seconds now: the end-to-end scenario executes on Process Lab's
      # own engine in-process, so nothing has to be deselected the way the old ~2-minute
      # research-engine run did.
      - name: Run tests
        run: python -m pytest -q
