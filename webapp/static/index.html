<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentSimulator Orchestrator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --border: #2a2f38; --text: #e8eaed;
    --muted: #9aa4b2; --accent: #4f8cff; --accent-2: #2ecc71; --danger: #e5534b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#ffffff; --border:#dde1e6; --text:#1b1f23; --muted:#5b6472; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex;
    align-items: baseline; gap: 10px; flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; }
  header span { color: var(--muted); font-size: 12px; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    max-width: 780px; width: 100%; margin: 0 auto;
  }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; }
  .card {
    align-self: flex-start; background: var(--panel); border: 1px solid var(--accent);
    border-radius: 10px; padding: 14px; max-width: 90%; font-size: 14px;
  }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .card table { border-collapse: collapse; margin: 8px 0; }
  .card td { padding: 2px 8px 2px 0; color: var(--muted); }
  .card td.v { color: var(--text); }
  .card .row { display: flex; gap: 10px; margin-top: 10px; }
  button {
    border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer;
  }
  .btn-confirm { background: var(--accent-2); color: white; }
  .btn-cancel { background: var(--danger); color: white; }
  .btn-confirm:disabled, .btn-cancel:disabled { opacity: .5; cursor: default; }
  #composer {
    border-top: 1px solid var(--border); padding: 14px 20px; display: flex; gap: 10px;
    max-width: 780px; width: 100%; margin: 0 auto; flex-shrink: 0;
  }
  #composer input {
    flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px;
  }
  #composer button { background: var(--accent); color: white; }
  #composer button:disabled { opacity: .5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; align-self: flex-start; padding-left: 4px; }
</style>
</head>
<body>
<header>
  <h1>AgentSimulator Orchestrator</h1>
  <span>LangGraph + DeepSeek — ask it to simulate a dataset</span>
</header>
<div id="chat"></div>
<div id="composer">
  <input id="input" type="text" placeholder="e.g. simulate LoanApp with 3 runs" maxlength="2000" autofocus>
  <button id="send">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let threadId = null;
let polling = false;

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.textContent = 'thinking…';
  el.id = 'typing-indicator';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function addConfirmCard(payload) {
  const el = document.createElement('div');
  el.className = 'card';
  const cols = payload.columns || {};
  el.innerHTML = `
    <h3>Confirm simulation run</h3>
    <table>
      <tr><td>dataset</td><td class="v">${payload.dataset_name}</td></tr>
      <tr><td>num_simulations</td><td class="v">${payload.num_simulations}</td></tr>
      <tr><td>mode</td><td class="v">${payload.determine_automatically ? 'auto-determined' :
        ('central_orchestration=' + payload.central_orchestration + ', extr_delays=' + payload.extr_delays)}</td></tr>
      <tr><td>case_id</td><td class="v">${cols.case_id ?? ''}</td></tr>
      <tr><td>activity</td><td class="v">${cols.activity_name ?? ''}</td></tr>
      <tr><td>resource</td><td class="v">${cols.resource ?? ''}</td></tr>
      <tr><td>start</td><td class="v">${cols.start_timestamp ?? ''}</td></tr>
      <tr><td>end</td><td class="v">${cols.end_timestamp ?? ''}</td></tr>
    </table>
    <div class="row">
      <button class="btn-confirm">Confirm & run</button>
      <button class="btn-cancel">Cancel</button>
    </div>`;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;

  const [confirmBtn, cancelBtn] = el.querySelectorAll('button');
  const decide = async (approved) => {
    confirmBtn.disabled = true; cancelBtn.disabled = true;
    await fetch(`/api/sessions/${threadId}/confirm`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({approved})
    });
    addTyping();
    pollStatus();
  };
  confirmBtn.onclick = () => decide(true);
  cancelBtn.onclick = () => decide(false);
}

async function pollStatus() {
  if (polling) return;
  polling = true;
  try {
    while (true) {
      const res = await fetch(`/api/sessions/${threadId}/status`);
      const data = await res.json();
      if (data.status === 'processing') {
        await new Promise(r => setTimeout(r, 1500));
        continue;
      }
      removeTyping();
      (data.messages || []).forEach(m => addMsg(m.role, m.content));
      if (data.status === 'confirmation_required' && data.interrupt) {
        addConfirmCard(data.interrupt);
      }
      if (data.status === 'error') {
        addMsg('system', 'Error: ' + data.error);
      }
      setInputEnabled(true);
      break;
    }
  } finally {
    polling = false;
  }
}

function setInputEnabled(enabled) {
  input.disabled = !enabled;
  sendBtn.disabled = !enabled;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg('user', text);
  input.value = '';
  setInputEnabled(false);
  addTyping();
  await fetch(`/api/sessions/${threadId}/messages`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})
  });
  pollStatus();
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

(async function init() {
  const res = await fetch('/api/sessions', {method: 'POST'});
  const data = await res.json();
  threadId = data.thread_id;
  addMsg('system', 'Session started. Ask me to simulate a dataset, e.g. "simulate LoanApp with 3 runs".');
})();
</script>
</body>
</html>
